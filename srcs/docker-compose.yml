services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

  wordpress:
    image: wordpress:latest
    depends_on:
      - db

  nginx:
    image: nginx:latest
    depends_on:
      - wordpress

volumes:
  db_data:
  wp_data:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
